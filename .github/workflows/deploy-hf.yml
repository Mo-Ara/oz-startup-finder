name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: huggingface
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Upload Space assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}
        run: |
          hf upload "$HF_SPACE_REPO_ID" \
            Dockerfile README.md app.py requirements.txt \
            agents shared ui scripts tests docs shared tools \
            --repo-type space \
            --ignore "*.db" \
            --ignore "*.csv" \
            --ignore ".git/*" \
            --ignore ".venv/*"
